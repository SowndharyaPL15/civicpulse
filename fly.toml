# fly.toml app configuration file for CivicPulse
# See https://fly.io/docs/reference/configuration/

app = "civicpulse"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "civicpulse_uploads"
  destination = "/var/www/html/uploads"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
